name: Deploy

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

# Without this block the workflow token gets the repository default, which grants
# write on issues, packages, deployments and more. The deploy only ever needs to
# push the gh-pages branch.
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
    - name: Enable bundler cache
      uses: actions/cache@v4
      with:
        path: vendor/bundle
        key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-gems-
    - name: Install deps
      run: |
        # jekyll-imagemagick shells out to `convert` to build the responsive
        # .webp variants behind every <picture>. The ubuntu-24.04 runner image no
        # longer ships ImageMagick, and the plugin only logs "convert: not found"
        # and carries on, so the build still exits 0 while every responsive image
        # silently goes missing. Install it, then assert it is really there.
        sudo apt-get update -qq
        sudo apt-get install -y -qq imagemagick
        convert -version
        gem install bundler
        bundle config path vendor/bundle
        bundle install --jobs 4 --retry 3
        # No mermaid CLI here on purpose. @mermaid-js/mermaid-cli pulls Puppeteer,
        # which downloads a full Chromium — it hung this step for over ten minutes
        # against a ~2 minute baseline. The site contains no diagrams, and
        # jekyll-diagrams merely logs "Command Not Found: mmdc" when it is absent.
        # If diagrams are ever added, install it here again and expect the extra
        # minutes.
    # Runs before the deploy on purpose. jekyll-imagemagick logs "convert: not
    # found" and carries on, so the build exits 0 while every responsive .webp
    # silently goes missing — and a browser picking a <source> that 404s does not
    # fall back to the <img>, so images just stop rendering. CI cannot catch that
    # without an explicit assertion. It also cannot run after bin/deploy, which
    # git-adds ignored paths (vendor/bundle included) into the deploy branch and
    # leaves the working tree without the gems.
    - name: Verify responsive images are generated
      run: |
        bundle exec jekyll build --destination /tmp/verify
        count=$(find /tmp/verify/assets/img -name '*.webp' | wc -l)
        echo "generated $count webp variants"
        test "$count" -gt 0 || { echo "::error::No .webp variants generated - is ImageMagick installed?"; exit 1; }
        for f in changyeon-480.webp changyeon-800.webp changyeon-1400.webp; do
          test -s "/tmp/verify/assets/img/$f" || { echo "::error::missing $f"; exit 1; }
        done
        echo "profile image variants present"

    - name: Setup deploy options
      id: setup
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        if [[ ${GITHUB_REF} = refs/pull/*/merge ]]; then # pull request
          echo "SRC_BRANCH=${GITHUB_HEAD_REF}" >> $GITHUB_OUTPUT
          echo "NO_PUSH=--no-push" >> $GITHUB_OUTPUT
        elif [[ ${GITHUB_REF} = refs/heads/* ]]; then # branch, e.g. master, source etc
          echo "SRC_BRANCH=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
        fi
        echo "DEPLOY_BRANCH=gh-pages" >> $GITHUB_OUTPUT
    # SRC_BRANCH derives from GITHUB_HEAD_REF, which a fork PR author controls.
    # Interpolating it into the shell with ${{ }} let a crafted branch name run
    # arbitrary commands on the runner. Passing through env and quoting keeps it
    # a value rather than script text.
    - name: Deploy website
      env:
        NO_PUSH: ${{ steps.setup.outputs.NO_PUSH }}
        SRC_BRANCH: ${{ steps.setup.outputs.SRC_BRANCH }}
        DEPLOY_BRANCH: ${{ steps.setup.outputs.DEPLOY_BRANCH }}
      run: yes | bin/deploy --verbose $NO_PUSH --src "$SRC_BRANCH" --deploy "$DEPLOY_BRANCH"
